name: Sync with Tenant Turner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm install --package-lock-only
          npm ci
      
      - name: Run sync script
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          TENANT_TURNER_API_KEY: ${{ secrets.TENANT_TURNER_API_KEY }}
          ENABLE_ZILLOW_FEED: ${{ secrets.ENABLE_ZILLOW_FEED || 'true' }}
          ZILLOW_FEED_URL: ${{ secrets.ZILLOW_FEED_URL }}
          NODE_OPTIONS: '--dns-result-order=ipv4first'
        run: node src/index.js
      
      - name: Upload Zillow feed to GitHub Pages
        if: env.ENABLE_ZILLOW_FEED == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src
          publish_branch: gh-pages
          keep_files: false
          destination_dir: feeds
          only_workflow_files: true
      
      - name: Show feed URL
        if: env.ENABLE_ZILLOW_FEED == 'true'
        run: |
          echo "📋 Feed URL for Zillow:"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feeds/zillow_feed.xml"
      
      - name: Show feed content
        if: env.ENABLE_ZILLOW_FEED == 'true'
        run: |
          echo "📄 Contenido del feed Zillow:"
          echo "--- INICIO DEL XML ---"
          cat src/zillow_feed.xml
          echo "--- FIN DEL XML ---"
          echo "📊 Total de propiedades: $(grep -c '<listing' src/zillow_feed.xml || echo '0')"
